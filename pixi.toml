[workspace]
name = "sans2d-mode-analyzer"
version = "0.1.0"
description = "Development environment for the SANS2D mode analyzer"
authors = ["SANS2D mode analyzer contributors"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.26"
matplotlib = ">=3.8"
scipy = ">=1.11"
h5py = ">=3.10"
pytest = ">=8"
pip = ">=24"

[pypi-dependencies]
sans2d-mode-analyzer = { path = ".", editable = true }

[tasks]
test = "pytest"
example = "python examples/synthetic_sphere_fit.py"
experimental-example = "python examples/experimental_10mT_fit.py"
prl-example = "python examples/experimental_prl_135_196706_fit.py"
analyze-arxiv-2606-18791 = "python experimental_data/doi_10.48550_arXiv.2606.18791/analyze_all.py"
analyze-prl-135-196706 = "python experimental_data/doi_10.1103_5yc2-pv4y/analyze_all.py"
